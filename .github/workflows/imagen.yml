# Compila la imagen Docker en GitHub y la publica en ghcr.io.
# Easypanel solo descarga la imagen ya hecha, no compila nada en el servidor.
name: Publicar imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/josephvillalba96/demo-dealerly:latest
            ghcr.io/josephvillalba96/demo-dealerly:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
